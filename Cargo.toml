[package]
name = "maonline_cli"
description = "A command-line interface for M&A Online."
repository = "https://github.com/strikegroup/maonline_cli"
homepage = "https://github.com/strikegroup/maonline_cli"
categories = ["command-line-utilities"]
keywords = ["maonline", "cli", "mergers", "acquisitions"]
version = "0.0.2"
edition = "2024"
default-run = "maonline"
license = "Apache-2.0"
exclude = [
    ".github/",
    ".gitignore",
    "about.hbs",
    "about.toml",
    "docs/",
    "packaging/",
    "release-plz.toml",
]

[[bin]]
name = "maonline"
path = "src/main.rs"

[package.metadata.dist]
formula = "maonline"
npm-package = "maonline-cli"
include = ["THIRD_PARTY_LICENSES.html"]

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# A GitHub repo to push Homebrew formulas to
tap = "strikegroup/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./publish-npm"]
# Jobs to run after a release is announced
post-announce-jobs = ["./publish-apt"]
# Permissions for custom GitHub Actions jobs
github-custom-job-permissions = { publish-apt = { contents = "write", pages = "write", id-token = "write" } }
# Whether dist should create a Github Release or use an existing draft
create-release = false
# Whether CI should trigger releases with dispatches instead of tag pushes
dispatch-releases = true

[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
anyhow = "1.0.101"
clap = { version = "4.5.58", features = ["derive"] }
directories = "6.0.0"
reqwest = "0.12.25"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.8.23"
httpdate = "1.0"
colored = "3.1.1"
