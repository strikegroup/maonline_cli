[package]
name = "maonline_cli"
description = "A command-line interface for the M&A Online."
repository = "https://github.com/strikegroup/maonline_cli"
categories = ["command-line-utilities"]
keywords = ["M&A Online", "cli", "M&A"]
version = "0.0.0"
edition = "2024"
default-run = "maonline"
license = "Apache-2.0"

[[bin]]
name = "maonline"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.101"
clap = { version = "4.5.58", features = ["derive"] }
directories = "6.0.0"
reqwest = "0.12.25"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.8.23"
async-recursion = "1.1.1"
