name: Publish Homebrew

on:
  workflow_call:
    inputs:
      plan:
        description: cargo-dist release plan
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v6

      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: strikegroup/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Fetch Homebrew formulae
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts/
          merge-multiple: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Commit changed formulae
        shell: bash
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          brew update
          node .github/scripts/publish.mjs homebrew artifacts tap
