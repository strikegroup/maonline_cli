name: Publish npm

on:
  workflow_call:
    inputs:
      plan:
        description: cargo-dist release plan
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true' }}
    runs-on: ubuntu-22.04
    env:
      PLAN: ${{ inputs.plan }}

    steps:
      - name: Checkout publisher
        uses: actions/checkout@v6

      - name: Download npm packages
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish npm packages
        shell: bash
        run: node .github/scripts/publish.mjs npm npm
