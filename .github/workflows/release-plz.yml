name: Release-plz

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      initial_release:
        description: Publish the first crates.io release from main
        required: true
        type: boolean
        default: false

jobs:
  release:
    name: Release
    if: ${{ github.event_name == 'push' || (inputs.initial_release && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Prepare initial release configuration
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          sed 's/^release_always = false$/release_always = true/' release-plz.toml \
            > "$RUNNER_TEMP/release-plz-initial.toml"

      - name: Publish crate and create GitHub Release
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          config: ${{ github.event_name == 'workflow_dispatch' && format('{0}/release-plz-initial.toml', runner.temp) || 'release-plz.toml' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Trigger binary release
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ fromJSON(steps.release-plz.outputs.releases)[0].tag }}
        run: gh workflow run release.yml -f "tag=$RELEASE_TAG"

  release-pr:
    name: Release PR
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Create or update Release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
